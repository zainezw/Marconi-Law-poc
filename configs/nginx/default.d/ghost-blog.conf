# Reverse proxy for the Ghost blog running in Docker on 10.10.229.11.
# Rocky Linux's default server block includes /etc/nginx/default.d/*.conf,
# so this file can be dropped in place without editing nginx.conf.

location /blog {
    proxy_pass          http://10.10.229.11:3001;
    proxy_set_header    Host              $http_host;                  # required for Docker client
    proxy_set_header    X-Real-IP         $remote_addr;                # pass on real client IP
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_read_timeout  900;
}
